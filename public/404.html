<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build Technology — Redirecting</title>
    <script>
      (function () {
        var base = '/website/';
        var hash = window.location.hash || '';
        window.location.replace(base + hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/website/" />
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9ff;
      color: #131129;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    "
  >
    <div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Build Technology</h1>
      <p style="color: #56536e; margin-bottom: 1.25rem;">
        Redirecting you to the Build Technology homepage...
      </p>
      <a
        href="/website/"
        style="
          display: inline-block;
          padding: 0.65rem 1.4rem;
          border-radius: 9999px;
          background: #5b42f3;
          color: #ffffff;
          font-weight: 600;
          font-size: 0.875rem;
          text-decoration: none;
        "
      >
        Go to Build Technology
      </a>
    </div>
  </body>
</html>
